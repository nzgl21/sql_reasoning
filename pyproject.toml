[project]
name = "sql-reasoning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "niyazgulov", email = "nzg2112@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gdown>=6.5.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
    "tensorboard>=2.21.0",
    "torch",
    "trl>=1.18.0",
    "verifiers[train]>=0.4.1",
]

[project.scripts]
sql-reasoning = "sql_reasoning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
